[package]
name = "lapm-daemon"
version = "0.1.0"
edition = "2024"

[dependencies]
# Internal
lapm-core = { path = "../lapm-core" }

# External
clap = { version = "4.6.1", features = ["derive"] }
serde = "1.0.228"
serde_json = "1.0.149"
tokio = { version = "1.52.3", features = ["full"] }
keepass = { version = "0.12.5", features = ["save_kdbx4"] }
directories = "6.0.0"
postcard = { version = "1.1.3", features = ["use-std"] }
tokio-util = "0.7.18"
interprocess = { version = "2.4.2", features = ["tokio"] }
thiserror = "2.0.18"
arboard = "3.6.1"
